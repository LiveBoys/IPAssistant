name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  QT_VERSION: "6.9.1"
  QT_ROOT: "C:\\Qt"
  BUILD_DIR: "ci-build"
  SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}

jobs:
  release:
    name: Build, test, package, and sign
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      installer_name: ${{ steps.version.outputs.installer_name }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $cmake = Get-Content -LiteralPath "CMakeLists.txt" -Raw
          $installer = Get-Content -LiteralPath "installer/IPAssistant.iss" -Raw

          if ($cmake -notmatch 'project\(IPAssistant VERSION ([0-9]+\.[0-9]+\.[0-9]+)') {
            throw "Unable to read the project version from CMakeLists.txt."
          }
          $version = $Matches[1]

          if ($installer -notmatch '#define MyAppVersion "([^"]+)"') {
            throw "Unable to read MyAppVersion from installer/IPAssistant.iss."
          }
          if ($Matches[1] -ne $version) {
            throw "CMake version $version does not match installer version $($Matches[1])."
          }

          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($tagVersion -ne $version) {
              throw "Tag version $tagVersion does not match project version $version."
            }
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "pe_version=$version.0" >> $env:GITHUB_OUTPUT
          "installer_name=IPAssistantSetup-$version.exe" >> $env:GITHUB_OUTPUT

          foreach ($resource in @(
            "src/resources/app.rc",
            "src/resources/service.rc"
          )) {
            $content = Get-Content -LiteralPath $resource -Raw
            $expected = $version.Replace(".", ",") + ",0"
            if ($content -notmatch "PRODUCTVERSION\s+$([regex]::Escape($expected))") {
              throw "$resource does not contain PRODUCTVERSION $expected."
            }
          }

      - name: Detect SignPath configuration
        id: signpath
        shell: pwsh
        env:
          SIGNPATH_TOKEN_FOR_CHECK: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $configured =
            -not [string]::IsNullOrWhiteSpace($env:SIGNPATH_ORGANIZATION_ID) -and
            -not [string]::IsNullOrWhiteSpace($env:SIGNPATH_TOKEN_FOR_CHECK)
          "configured=$($configured.ToString().ToLowerInvariant())" >>
            $env:GITHUB_OUTPUT

      - name: Install Qt and MinGW
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0
          python -m aqt install-qt windows desktop `
            $env:QT_VERSION win64_mingw -O $env:QT_ROOT
          python -m aqt install-tool windows desktop `
            tools_mingw1310 -O $env:QT_ROOT

          "$env:QT_ROOT\$env:QT_VERSION\mingw_64\bin" >>
            $env:GITHUB_PATH
          "$env:QT_ROOT\Tools\mingw1310_64\bin" >>
            $env:GITHUB_PATH

      - name: Configure Release build
        shell: pwsh
        run: |
          cmake -S . -B $env:BUILD_DIR `
            -G "MinGW Makefiles" `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT\$env:QT_VERSION\mingw_64" `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build application and tests
        shell: pwsh
        run: |
          cmake --build $env:BUILD_DIR -j 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run tests
        shell: pwsh
        run: |
          ctest --test-dir $env:BUILD_DIR `
            --output-on-failure `
            -C Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          & "$env:QT_ROOT\$env:QT_VERSION\mingw_64\bin\windeployqt.exe" `
            --release `
            --compiler-runtime `
            "$env:BUILD_DIR\IPAssistant.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload unsigned project binaries
        id: upload-unsigned-binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-project-binaries-${{ steps.version.outputs.version }}
          path: |
            ${{ env.BUILD_DIR }}/IPAssistant.exe
            ${{ env.BUILD_DIR }}/IPAssistantService.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Require SignPath for tagged releases
        if: github.ref_type == 'tag' && steps.signpath.outputs.configured != 'true'
        shell: pwsh
        run: |
          throw @"
          Tagged releases require SignPath.
          Configure SIGNPATH_ORGANIZATION_ID as a repository variable and
          SIGNPATH_API_TOKEN as a repository Actions secret.
          "@

      - name: Sign project binaries with SignPath
        if: steps.signpath.outputs.configured == 'true'
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: IPAssistant
          signing-policy-slug: release-signing
          artifact-configuration-slug: release-binaries
          github-artifact-id: ${{ steps.upload-unsigned-binaries.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signpath-binaries
          parameters: |
            version: "${{ steps.version.outputs.pe_version }}"

      - name: Stage signed project binaries
        if: steps.signpath.outputs.configured == 'true'
        shell: pwsh
        run: |
          $files = @("IPAssistant.exe", "IPAssistantService.exe")
          foreach ($file in $files) {
            $source = Join-Path "signpath-binaries" $file
            if (-not (Test-Path -LiteralPath $source)) {
              throw "SignPath output is missing $file."
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $source
            if ($signature.Status -ne "Valid") {
              throw "Invalid SignPath signature for $file`: $($signature.Status)"
            }
            Copy-Item -LiteralPath $source `
              -Destination (Join-Path $env:BUILD_DIR $file) `
              -Force
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Inno Setup 6.7.1 does not bundle Simplified Chinese. Download the
          # official translation from an immutable upstream commit and verify it.
          $languagePath = "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/683ee7eabfbce807f901c5da83fc5ff1a3ecb693/Files/Languages/ChineseSimplified.isl" `
            -OutFile $languagePath
          $expectedHash = "6753BE2C5E2740D859900FD902824DB2EC568DA5C5B52486524C9762D778B0B0"
          $actualHash = (Get-FileHash -LiteralPath $languagePath -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) {
            throw "Unexpected SHA256 for ChineseSimplified.isl: $actualHash"
          }

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DBuildDir=..\$env:BUILD_DIR" `
            "installer\IPAssistant.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload unsigned installer
        id: upload-unsigned-installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-installer-${{ steps.version.outputs.version }}
          path: installer/Output/${{ steps.version.outputs.installer_name }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Sign installer with SignPath
        if: steps.signpath.outputs.configured == 'true'
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: IPAssistant
          signing-policy-slug: release-signing
          artifact-configuration-slug: release-installer
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signpath-installer
          parameters: |
            version: "${{ steps.version.outputs.pe_version }}"
            installerFileName: "${{ steps.version.outputs.installer_name }}"

      - name: Stage final release files
        id: final
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "release" -Force | Out-Null
          $installerName = "${{ steps.version.outputs.installer_name }}"

          if ("${{ steps.signpath.outputs.configured }}" -eq "true") {
            $source = Join-Path "signpath-installer" $installerName
            if (-not (Test-Path -LiteralPath $source)) {
              throw "SignPath output is missing $installerName."
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $source
            if ($signature.Status -ne "Valid") {
              throw "Invalid installer signature: $($signature.Status)"
            }
          } else {
            $source = Join-Path "installer\Output" $installerName
          }

          $destination = Join-Path "release" $installerName
          Copy-Item -LiteralPath $source -Destination $destination -Force
          $hash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash
          "$hash  $installerName" |
            Set-Content -LiteralPath "$destination.sha256" `
              -Encoding ascii

      - name: Upload final release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: IPAssistant-${{ steps.version.outputs.version }}-x64
          path: release/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download signed release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: IPAssistant-${{ needs.release.outputs.version }}-x64
          path: release

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_NAME: ${{ needs.release.outputs.installer_name }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release/$INSTALLER_NAME" \
            "release/$INSTALLER_NAME.sha256" \
            --verify-tag \
            --title "IP Assistant $RELEASE_VERSION" \
            --notes "Code signing policy: https://github.com/LiveBoys/IPAssistant/blob/main/.signpath/README.md" \
            --generate-notes
